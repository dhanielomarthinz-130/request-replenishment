name: Deploy ke InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # FTP-Deploy-Action menyimpan state sinkronisasi di server, jadi dua deploy
  # yang jalan bersamaan bisa saling menimpa. Antrekan saja.
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync ke InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # InfinityFree menaruh document root di /htdocs/. Kalau akun Anda
          # memakai subfolder, tambahkan secret FTP_SERVER_DIR (mis. /htdocs/wms/).
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/htdocs/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/Code.gs
